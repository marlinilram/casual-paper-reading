<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="paper-archive-title" content="{{META_TITLE}}">
  <meta name="paper-archive-summary" content="{{META_SUMMARY}}">
  <meta name="paper-archive-created" content="{{CREATED_AT}}">
  <title>{{DOCUMENT_TITLE}}</title>
  <style>
    :root { color-scheme: light dark; --bg:#f4f3ef; --paper:#fffdfa; --ink:#1c2533; --muted:#637083; --line:#d9dee7; --accent:#2957d3; --accent2:#7449d8; --good:#087f5b; --warn:#b45309; --soft:#edf2ff; --shadow:0 18px 50px rgba(29,42,68,.10); }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:linear-gradient(180deg,#e9edff 0,#f4f3ef 24rem); color:var(--ink); font:16px/1.72 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }
    a { color:var(--accent); text-underline-offset:3px; }
    .shell { width:min(1120px,calc(100% - 32px)); margin:0 auto; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:22px 0; color:#34415a; }
    .topbar a { text-decoration:none; font-weight:700; }
    .badge { display:inline-flex; align-items:center; gap:8px; border:1px solid rgba(41,87,211,.22); background:rgba(255,255,255,.72); border-radius:999px; padding:6px 11px; font-size:.78rem; font-weight:800; letter-spacing:.03em; color:#304a91; }
    .hero { position:relative; overflow:hidden; border:1px solid rgba(255,255,255,.7); border-radius:28px; padding:clamp(28px,5vw,62px); color:white; background:radial-gradient(circle at 80% 10%,rgba(255,255,255,.24),transparent 28%),linear-gradient(135deg,#17358f,#5841c5 68%,#9c4dcc); box-shadow:var(--shadow); }
    .hero:after { content:""; position:absolute; width:280px; height:280px; border:1px solid rgba(255,255,255,.25); border-radius:50%; right:-90px; bottom:-160px; }
    .eyebrow { font-size:.78rem; text-transform:uppercase; letter-spacing:.14em; font-weight:900; opacity:.82; }
    h1 { max-width:900px; margin:.35em 0 .3em; font-size:clamp(2rem,5vw,4.5rem); line-height:1.05; letter-spacing:-.045em; }
    .hero-summary { max-width:850px; margin:0; font-size:clamp(1.05rem,2vw,1.32rem); opacity:.92; }
    .meta { display:flex; flex-wrap:wrap; gap:9px; margin-top:26px; }
    .meta span,.meta a { color:white; text-decoration:none; border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.11); border-radius:999px; padding:7px 11px; font-size:.82rem; }
    main { display:grid; grid-template-columns:minmax(0,1fr) 260px; gap:28px; padding:34px 0 70px; }
    article { min-width:0; }
    aside { align-self:start; position:sticky; top:18px; }
    .panel { background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:24px; box-shadow:0 8px 30px rgba(29,42,68,.05); margin-bottom:20px; }
    .toc a { display:block; padding:7px 0; text-decoration:none; color:var(--muted); border-bottom:1px dashed var(--line); font-size:.9rem; }
    .toc a:last-child { border:0; }
    h2 { margin:0 0 14px; font-size:clamp(1.45rem,3vw,2.05rem); line-height:1.2; letter-spacing:-.025em; }
    h3 { margin:0 0 9px; font-size:1.04rem; }
    p { margin:.65em 0; }
    .lede { color:#30466f; font-size:1.08rem; font-weight:700; }
    .key-grid,.metric-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; }
    .key { border-top:4px solid var(--accent); background:linear-gradient(180deg,var(--soft),transparent); border-radius:14px; padding:17px; font-weight:650; }
    .flow { display:flex; align-items:stretch; gap:10px; overflow-x:auto; padding:4px 2px 12px; }
    .flow-node { flex:1 0 170px; min-height:116px; border:1px solid #cdd7fa; border-radius:16px; padding:17px; background:linear-gradient(145deg,#f8faff,#edf2ff); }
    .flow-node strong { display:block; color:#2447ad; font-size:1rem; }
    .flow-node small { display:block; margin-top:7px; color:#56647b; }
    .arrow { align-self:center; color:var(--accent2); font-size:1.55rem; font-weight:900; }
    .metric { border-radius:16px; padding:18px; background:#f6f7fb; border:1px solid var(--line); }
    .metric.good { background:#ecfdf5; border-color:#b7ead7; }
    .metric.warn { background:#fff7ed; border-color:#fed7aa; }
    .metric-label { color:var(--muted); font-size:.79rem; text-transform:uppercase; letter-spacing:.07em; font-weight:800; }
    .metric-value { display:block; margin:4px 0; font-size:1.7rem; line-height:1.15; font-weight:900; letter-spacing:-.03em; }
    .metric-context { color:var(--muted); font-size:.85rem; }
    ul { padding-left:1.25rem; }
    li { margin:.45em 0; }
    .callout { margin:18px 0; border-left:5px solid var(--accent); background:#eef3ff; border-radius:0 14px 14px 0; padding:16px 18px; }
    .callout.good { border-color:var(--good); background:#ecfdf5; }
    .callout.warn { border-color:var(--warn); background:#fff7ed; }
    .table-wrap { overflow:auto; margin:18px 0; border:1px solid var(--line); border-radius:14px; }
    table { width:100%; border-collapse:collapse; min-width:520px; background:var(--paper); }
    caption { text-align:left; padding:13px 15px; font-weight:800; background:#f1f4fa; }
    th,td { padding:12px 15px; text-align:left; vertical-align:top; border-top:1px solid var(--line); }
    th { color:#30466f; font-size:.84rem; background:#fafbfe; }
    figure { position:relative; margin:20px 0; }
    figure img { width:100%; max-height:680px; object-fit:contain; background:#f5f6f8; border:1px solid var(--line); border-radius:16px; transition:transform .18s ease,box-shadow .18s ease; }
    .figure-link { display:block; line-height:0; }
    .figure-link:hover img { transform:translateY(-2px); box-shadow:0 14px 36px rgba(29,42,68,.13); }
    figcaption { color:var(--muted); font-size:.86rem; margin-top:8px; }
    .visual-badges { position:absolute; z-index:2; display:flex; gap:6px; top:10px; left:10px; }
    .visual-badges span { border:1px solid rgba(255,255,255,.7); background:rgba(22,32,51,.82); color:white; border-radius:999px; padding:4px 8px; font-size:.68rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em; backdrop-filter:blur(8px); }
    .visual-group { margin:24px 0; padding:18px; border:1px solid var(--line); border-radius:17px; background:#f8f9fc; }
    .visual-group h3 { margin-bottom:2px; }
    .visual-group-caption { margin:.25em 0 14px; color:var(--muted); }
    .visual-grid { display:grid; grid-template-columns:repeat(var(--visual-columns,2),minmax(0,1fr)); gap:14px; }
    .figure-card { margin:0; min-width:0; }
    .figure-card img { height:clamp(180px,28vw,360px); object-fit:contain; }
    code { border:1px solid var(--line); background:#f2f4f8; border-radius:6px; padding:.12em .36em; font-size:.88em; }
    .refs { list-style:none; padding:0; }
    .refs li { padding:10px 0; border-bottom:1px solid var(--line); }
    .refs li:last-child { border:0; }
    .foot { color:var(--muted); font-size:.82rem; padding:0 0 40px; }
    @media (max-width:820px) { main { grid-template-columns:1fr; } aside { position:static; order:-1; } .toc { display:none; } .hero { border-radius:22px; } .visual-grid { grid-template-columns:1fr; } }
    @media (prefers-color-scheme:dark) { :root { --bg:#111827; --paper:#182131; --ink:#e7edf7; --muted:#a8b3c7; --line:#334158; --soft:#202d4a; } body { background:linear-gradient(180deg,#151d3d 0,#111827 24rem); } .topbar { color:#cbd5e1; } .badge { background:#1d2941;color:#c8d5ff; } .lede { color:#cad7f0; } .key { background:#202d4a; } .flow-node { background:#202d4a;border-color:#405282; } .flow-node strong { color:#b8c7ff; } .flow-node small { color:#bdc8dc; } .metric,th,caption { background:#202a3b; } .metric.good,.callout.good { background:#12352d; } .metric.warn,.callout.warn { background:#3b2a16; } .callout { background:#202f52; } .visual-group { background:#202a3b; } code { background:#222c3d; } }
  </style>
</head>
<body>
  <div class="shell">
    <nav class="topbar"><a href="index.html">← Casual Reading</a><span class="badge">PAPER ANALYSIS</span></nav>
    {{HERO}}
    <main>
      <article>{{ARTICLE}}</article>
      <aside>{{ASIDE}}</aside>
    </main>
    <footer class="foot">Generated on {{CREATED_DISPLAY}} · Evidence and interpretations should be checked against the linked paper version.</footer>
  </div>
  <script type="application/json" id="paper-reading-metadata">{{METADATA_JSON}}</script>
</body>
</html>
