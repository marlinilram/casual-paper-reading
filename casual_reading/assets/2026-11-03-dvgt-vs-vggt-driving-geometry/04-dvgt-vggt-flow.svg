x="170.0" y="167" text-anchor="middle" font-size="18" font-weight="760" fill="#3156c8"><tspan x="170.0" dy="0">VGGT input</tspan></text><text x="170.0" y="203" text-anchor="middle" font-size="13" font-weight="430" fill="#526174"><tspan x="170.0" dy="0">arbitrary unordered images; first</tspan><tspan x="170.0" dy="17">image is reference</tspan></text><rect x="375" y="125" width="230" height="126" rx="17" fill="#f0eaff" stroke="#7449d8" stroke-width="2"/><text x="490.0" y="167" text-anchor="middle" font-size="18" font-weight="760" fill="#7449d8"><tspan x="490.0" dy="0">Frame + global attention</tspan></text><text x="490.0" y="203" text-anchor="middle" font-size="13" font-weight="430" fill="#526174"><tspan x="490.0" dy="0">all image tokens meet in global</tspan><tspan x="490.0" dy="17">self-attention</tspan></text><rect x="695" y="125" width="230" height="126" rx="17" fill="#eef1f5" stroke="#526174" stroke-width="2"/><text x="810.0" y="167" text-anchor="middle" font-size="18" font-weight="760" fill="#526174"><tspan x="810.0" dy="0">General geometry outputs</tspan></text><text x="810.0" y="203" text-anchor="middle" font-size="13" font-weight="430" fill="#526174"><tspan x="810.0" dy="0">per-camera pose/intrinsics, depth,</tspan><tspan x="810.0" dy="17">point map, tracks; relative scale</tspan></text><rect x="55" y="306" width="230" height="126" rx="17" fill="#e8efff" stroke="#3156c8" stroke-width="2"/><text x="170.0" y="348" text-anchor="middle" font-size="18" font-weight="760" fill="#3156c8"><tspan x="170.0" dy="0">DVGT input</tspan></text><text x="170.0" y="384" text-anchor="middle" font-size="13" font-weight="430" fill="#526174"><tspan x="170.0" dy="0">T frames × V fixed-rig views with</tspan><tspan x="170.0" dy="17">view identity/order</tspan></text><rect x="375" y="306" width="230" height="126" rx="17" fill="#fff1df" stroke="#b45309" stroke-width="2"/><text x="490.0" y="348" text-anchor="middle" font-size="18" font-weight="760" fill="#b45309"><tspan x="490.0" dy="0"