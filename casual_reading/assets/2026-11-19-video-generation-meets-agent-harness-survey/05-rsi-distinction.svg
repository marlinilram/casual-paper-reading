<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="492" viewBox="0 0 1620 492" role="img" aria-label="从“修好当前视频”到真正的递归自改进"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#596a86"/></marker></defs><rect width="1620" height="492" rx="28" fill="#f7f9fd"/><text x="810.0" y="42" text-anchor="middle" font-size="28" font-weight="750" fill="#172033"><tspan x="810.0" dy="0">从“修好当前视频”到真正的递归自改进</tspan></text><text x="810.0" y="82" text-anchor="middle" font-size="15" font-weight="400" fill="#667085"><tspan x="810.0" dy="0">重绘自论文 §2.3、§5 与 §5.3；变化发生在哪里，决定它能否被称为 RSI</tspan></text><path d="M285,188.0 C330.0,188.0 330.0,188.0 375,188.0" fill="none" stroke="#596a86" stroke-width="2.5" marker-end="url(#arrow)"/><text x="330.0" y="180.0" text-anchor="middle" font-size="12" font-weight="650" fill="#526174"><tspan x="330.0" dy="0">即时反馈</tspan></text><path d="M605,188.0 C650.0,188.0 650.0,188.0 695,188.0" fill="none" stroke="#596a86" stroke-width="2.5" marker-end="url(#arrow)"/><text x="650.0" y="180.0" text-anchor="middle" font-size="12" font-weight="650" fill="#526174"><tspan x="650.0" dy="0">若被保留</tspan></text><path d="M925,188.0 C970.0,188.0 970.0,188.0 1015,188.0" fill="none" stroke="#596a86" stroke-width="2.5" marker-end="url(#arrow)"/><text x="970.0" y="180.0" text-anchor="middle" font-size="12" font-weight="650" fill="#526174"><tspan x="970.0" dy="0">若改变改进方法</tspan></text><path d="M1245,188.0 C1290.0,188.0 1290.0,188.0 1335,188.0" fill="none" stroke="#596a86" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1290.0" y="180.0" text-anchor="middle" font-size="12" font-weight="650" fill="#526174"><tspan x="1290.0" dy="0">必须验证</tspan></text><path d="M1450.0,251 C1450.0,251 1450.0,306 1450.0,306" fill="none" stroke="#596a86" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1450.0" y="270.5" text-anchor="middle" font-size="12" font-weight="650" fill="#526174"><tspan x="1450.0" dy="0">跨轮收益</tspan></text><rect x="55" y="125" width="230" height="126" rx="17" fill="#eef1f5" stroke="#526174" stroke-width="2"/><text x="170.0" y="167" text-anchor="middle" font-size="18" font-weight="760" fill="#526174"><tspan x="170.0" dy="0">执行轨迹与反馈</tspan></text><text x="170.0" y="203" text-anchor="middle" font-size="13" font-weight="430" fill="#526174"><tspan x="170.0" dy="0">视频/世界交互 trace、失败证据、成本 Bk</tspan></text><rect x="375" y="125" width="230" height="126" rx="17" fill="#fff1df" stroke="#b45309" stroke-width="2"/><text x="490.0" y="167" text-anchor="middle" font-size="18" font-weight="760" fill="#b45309"><tspan x="490.0" dy="0">修复当前输出</tspan></text><text x="490.0" y="203" text-anchor="middle" font-size="13" font-weight="430" fill="#526174"><tspan x="490.0" dy="0">改 prompt、换 take、局部编辑；不产生跨任务能力</tspan></text><rect x="695" y="125" width="230" height="126" rx="17" fill="#e8efff" stroke="#3156c8" stroke-width="2"/><text x="810.0" y="167" text-anchor="middle" font-size="18" font-weight="760" fill="#3156c8"><tspan x="810.0" dy="0">更新持久状态 ξ</tspan></text><text x="810.0" y="203" text-anchor="middle" font-size="13" font-weight="430" fill="#526174"><tspan x="810.0" dy="0">记忆、技能、数据、生成器、critic；可改善后续任务</tspan></text><rect x="1015" y="125" width="230" height="126" rx="17" fill="#f0eaff" stroke="#7449d8" stroke-width="2"/><text x="1130.0" y="167" text-anchor="middle" font-size="18" font-weight="760" fill="#7449d8"><tspan x="1130.0" dy="0">修改开发程序 ρ</tspan></text><text x="1130.0" y="203" text-anchor="middle" font-size="13" font-weight="430" fill="#526174"><tspan x="1130.0" dy="0">改变失败发现、数据选择、训练或候选验证方式</tspan></text><rect x="1335" y="125" width="230" height="126" rx="17" fill="#e4f7ef" stroke="#087f5b" stroke-width="2"/><text x="1450.0" y="167" text-anchor="middle" font-size="18" font-weight="760" fill="#087f5b"><tspan x="1450.0" dy="0">独立多轮验证</tspan></text><text x="1450.0" y="203" text-anchor="middle" font-size="13" font-weight="430" fill="#526174"><tspan x="1450.0" dy="0">held-out tasks、匹配预算、回归检查；后续更新更好/更省</tspan></text><rect x="1335" y="306" width="230" height="126" rx="17" fill="#ffe7e7" stroke="#b73535" stroke-width="2"/><text x="1450.0" y="348" text-anchor="middle" font-size="18" font-weight="760" fill="#b73535"><tspan x="1450.0" dy="0">才可支持 RSI 声明</tspan></text><text x="1450.0" y="384" text-anchor="middle" font-size="13" font-weight="430" fill="#526174"><tspan x="1450.0" dy="0">ρk+1 在后续开发轮次优于固定 ρk；当前 surveyed</tspan><tspan x="1450.0" dy="17">systems 尚未证明</tspan></text><text x="1596" y="474" text-anchor="end" font-size="11" fill="#7a8799">Source: arXiv:2610.40191v1, Sections 2.3, 5, and 5.3 (redrawn synthesis)</text></svg>