<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="990" viewBox="0 0 1600 990" role="img" aria-labelledby="title desc">
  <title id="title">SliderQuant 与 VGGT 聚合器的结合设计</title>
  <desc id="desc">SliderQuant 的滑窗单位被重新定义为包含同序号 frame block 和 global block 的 VGGT stage，特殊 token、DPT 与 camera heads 保持高精度。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eef9f5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#28344f" flood-opacity="0.13"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L10,5.5 L0,11 z" fill="#4d5d78"/></marker>
    <marker id="arrowP" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L10,5.5 L0,11 z" fill="#7546c9"/></marker>
    <style>
      text{font-family:Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif}.h1{font-size:32px;font-weight:800;fill:#15213a}.h2{font-size:22px;font-weight:800;fill:#24324b}.label{font-size:17px;font-weight:750;fill:#24324b}.body{font-size:14px;fill:#526174}.small{font-size:12px;fill:#68758a}.white{fill:white}.box{fill:#fff;stroke:#9aa8bc;stroke-width:1.7}.stage{fill:#e7efff;stroke:#315fc4;stroke-width:2}.frame{fill:#e7f7f0;stroke:#14805f;stroke-width:2}.global{fill:#eae5ff;stroke:#6c47c7;stroke-width:2}.fp{fill:#fff0d8;stroke:#c87808;stroke-width:2}.cal{fill:#f3eaff;stroke:#7546c9;stroke-width:2}.edge{fill:none;stroke:#4d5d78;stroke-width:2.4;marker-end:url(#arrow)}.cedge{fill:none;stroke:#7546c9;stroke-width:2.4;stroke-dasharray:9 7;marker-end:url(#arrowP)}
    </style>
  </defs>
  <rect width="1600" height="990" rx="30" fill="url(#bg)"/>
  <text x="800" y="52" text-anchor="middle" class="h1">SliderQuant × VGGT：以“交替注意力 Stage”而非单层作为滑窗单位</text>
  <text x="800" y="82" text-anchor="middle" class="body">Stage Gℓ = GlobalBlockℓ(FrameBlockℓ(·))；避免把 24 个 frame blocks 与 24 个 global blocks 分开量化而破坏误差耦合</text>

  <!-- runtime path -->
  <rect x="42" y="112" width="1516" height="492" rx="24" fill="#fff" stroke="#b5c2d4" stroke-width="2"/>
  <rect x="64" y="130" width="248" height="38" rx="19" fill="#315fc4"/><text x="188" y="156" text-anchor="middle" class="label white">在线：量化后的 VGGT 聚合器</text>

  <rect x="72" y="232" width="160" height="104" rx="16" class="box" filter="url(#shadow)"/>
  <text x="152" y="262" text-anchor="middle" class="label">多视图 / 视频帧</text><text x="152" y="288" text-anchor="middle" class="body">B × S × 3 × H × W</text><text x="152" y="313" text-anchor="middle" class="small">统一归一化</text>
  <rect x="278" y="224" width="178" height="120" rx="16" class="fp"/>
  <text x="367" y="254" text-anchor="middle" class="label">Patch Embed</text><text x="367" y="281" text-anchor="middle" class="body">DINOv2 ViT-L/14</text><text x="367" y="307" text-anchor="middle" class="body">FP16/BF16</text><text x="367" y="329" text-anchor="middle" class="small">输入分布敏感</text>
  <rect x="496" y="214" width="202" height="140" rx="16" class="fp"/>
  <text x="597" y="244" text-anchor="middle" class="label">特殊 Token 拼接</text><text x="597" y="272" text-anchor="middle" class="body">1 camera token</text><text x="597" y="296" text-anchor="middle" class="body">4 register tokens</text><text x="597" y="320" text-anchor="middle" class="body">+ patch tokens</text><text x="597" y="341" text-anchor="middle" class="small">token 参数与归一化保持高精度</text>

  <rect x="744" y="184" width="470" height="202" rx="22" class="stage" filter="url(#shadow)"/>
  <text x="979" y="216" text-anchor="middle" class="h2">Quantized VGGT Stage Gℓ</text>
  <rect x="774" y="240" width="182" height="116" rx="15" class="frame"/>
  <text x="865" y="268" text-anchor="middle" class="label">FrameBlockℓ</text><text x="865" y="295" text-anchor="middle" class="body">每帧内部 attention</text><text x="865" y="321" text-anchor="middle" class="body">QKV/Proj/FFN：W4A8</text><text x="865" y="343" text-anchor="middle" class="small">Norm/Softmax/RoPE：FP16</text>
  <rect x="1002" y="240" width="182" height="116" rx="15" class="global"/>
  <text x="1093" y="268" text-anchor="middle" class="label">GlobalBlockℓ</text><text x="1093" y="295" text-anchor="middle" class="body">跨帧全局 attention</text><text x="1093" y="321" text-anchor="middle" class="body">QKV/Proj/FFN：W4A8</text><text x="1093" y="343" text-anchor="middle" class="small">Norm/Softmax/RoPE：FP16</text>
  <path d="M956 298 H992" class="edge"/>

  <rect x="1260" y="200" width="250" height="170" rx="18" class="fp"/>
  <text x="1385" y="230" text-anchor="middle" class="label">高精度几何 Heads</text>
  <text x="1385" y="258" text-anchor="middle" class="body">CameraHead → pose</text>
  <text x="1385" y="282" text-anchor="middle" class="body">DPTHead → depth / conf</text>
  <text x="1385" y="306" text-anchor="middle" class="body">DPTHead → world points</text>
  <text x="1385" y="330" text-anchor="middle" class="body">TrackHead → tracks / vis</text>
  <text x="1385" y="352" text-anchor="middle" class="small">官方 forward 中主要几何头禁用 autocast</text>

  <path d="M232 284 H268" class="edge"/><path d="M456 284 H486" class="edge"/><path d="M698 284 H734" class="edge"/><path d="M1214 284 H1250" class="edge"/>

  <text x="744" y="424" class="label">24 个交替 Stage 与 4 个多尺度 tap</text>
  <g transform="translate(744 448)">
    <rect x="0" y="0" width="70" height="62" rx="11" class="stage"/><text x="35" y="28" text-anchor="middle" class="body">G1</text><text x="35" y="49" text-anchor="middle" class="small">anchor</text>
    <rect x="82" y="0" width="70" height="62" rx="11" class="stage"/><text x="117" y="28" text-anchor="middle" class="body">G2</text>
    <rect x="164" y="0" width="70" height="62" rx="11" class="stage"/><text x="199" y="28" text-anchor="middle" class="body">G3</text>
    <rect x="246" y="0" width="70" height="62" rx="11" class="stage"/><text x="281" y="28" text-anchor="middle" class="body">G4</text><circle cx="281" cy="49" r="6" fill="#d94a49"/>
    <text x="342" y="38" class="label">…</text>
    <rect x="374" y="0" width="70" height="62" rx="11" class="stage"/><text x="409" y="28" text-anchor="middle" class="body">G11</text><circle cx="409" cy="49" r="6" fill="#d94a49"/>
    <text x="468" y="38" class="label">…</text>
    <rect x="500" y="0" width="70" height="62" rx="11" class="stage"/><text x="535" y="28" text-anchor="middle" class="body">G17</text><circle cx="535" cy="49" r="6" fill="#d94a49"/>
    <text x="594" y="38" class="label">…</text>
    <rect x="626" y="0" width="70" height="62" rx="11" class="stage"/><text x="661" y="28" text-anchor="middle" class="body">G23</text>
    <rect x="708" y="0" width="70" height="62" rx="11" class="stage"/><text x="743" y="28" text-anchor="middle" class="body">G24</text><circle cx="743" cy="49" r="6" fill="#d94a49"/><text x="743" y="82" text-anchor="middle" class="small">last anchor</text>
  </g>
  <circle cx="748" cy="550" r="6" fill="#d94a49"/><text x="764" y="555" class="small">官方 cached_layer_indices=(4,11,17,23)，零基下对应第 5/12/18/24 个 stage</text>

  <!-- Calibration schedule -->
  <rect x="42" y="630" width="1516" height="304" rx="24" fill="#fbf8ff" stroke="#7546c9" stroke-width="2.5" stroke-dasharray="11 8"/>
  <rect x="64" y="648" width="290" height="38" rx="19" fill="#7546c9"/><text x="209" y="674" text-anchor="middle" class="label white">仅离线：VGGT 版 SliderQuant</text>

  <rect x="82" y="720" width="286" height="154" rx="16" class="cal"/>
  <text x="225" y="750" text-anchor="middle" class="label">Inter-S：Stage 滑窗</text>
  <text x="225" y="780" text-anchor="middle" class="body">浅层：G1 → G1:G2 → G1:G4</text>
  <text x="225" y="806" text-anchor="middle" class="body">中层：[Gℓ,Gℓ+1]，stride=1</text>
  <text x="225" y="832" text-anchor="middle" class="body">深层：G21:G24 → G23:G24 → G24</text>
  <text x="225" y="856" text-anchor="middle" class="small">先用 4 / 2 / 4 默认值，再按几何敏感度调整</text>

  <rect x="416" y="720" width="286" height="154" rx="16" class="cal"/>
  <text x="559" y="750" text-anchor="middle" class="label">Intra-S：Stage 内联合量化</text>
  <text x="559" y="780" text-anchor="middle" class="body">Frame + Global 同时优化</text>
  <text x="559" y="806" text-anchor="middle" class="body">γ=0.5：通道 / 参数维两阶段扩展</text>
  <text x="559" y="832" text-anchor="middle" class="body">α 与 AB 在导出时吸收</text>
  <text x="559" y="856" text-anchor="middle" class="small">不得跨分支只优化一侧，否则误差会串入下一 stage</text>

  <rect x="750" y="704" width="366" height="186" rx="16" class="cal"/>
  <text x="933" y="734" text-anchor="middle" class="label">几何感知重建目标</text>
  <text x="933" y="764" text-anchor="middle" class="body">Lpatch：普通 patch token 特征 MSE</text>
  <text x="933" y="790" text-anchor="middle" class="body">Lspecial：camera / register token 加权 MSE</text>
  <text x="933" y="816" text-anchor="middle" class="body">Ltap：4 个 cached feature 的蒸馏</text>
  <text x="933" y="842" text-anchor="middle" class="body">Lgeo：pose + depth + point + confidence 一致性</text>
  <text x="933" y="868" text-anchor="middle" class="small">Lspecial / Ltap / Lgeo 是迁移到 VGGT 时必须新增的目标</text>

  <rect x="1164" y="720" width="344" height="154" rx="16" class="fp"/>
  <text x="1336" y="750" text-anchor="middle" class="label">精度边界</text>
  <text x="1336" y="780" text-anchor="middle" class="body">优先量化：Aggregator 中 QKV / Proj / FFN</text>
  <text x="1336" y="806" text-anchor="middle" class="body">保留：PatchEmbed、特殊 token、Norm、RoPE</text>
  <text x="1336" y="832" text-anchor="middle" class="body">保留：Camera / DPT / Track Heads</text>
  <text x="1336" y="856" text-anchor="middle" class="small">达到 W4A8 基线后再探索 W4A4 或头部量化</text>

  <path d="M368 797 H406" class="cedge"/><path d="M702 797 H740" class="cedge"/><path d="M1116 797 H1154" class="cedge"/>
  <text x="1518" y="962" text-anchor="end" class="small">综合官方 VGGT Aggregator 代码、SliderQuant §3.2 与 QuantVGGT/FGQ 的敏感度结论；本图为设计推演</text>
</svg>
