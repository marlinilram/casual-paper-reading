<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="673" viewBox="0 0 1620 673" role="img" aria-label="Pixel-space diffusion：从可行性验证到产业桥接"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#596a86"/></marker></defs><rect width="1620" height="673" rx="28" fill="#f7f9fd"/><text x="810.0" y="42" text-anchor="middle" font-size="28" font-weight="750" fill="#172033"><tspan x="810.0" dy="0">Pixel-space diffusion：从可行性验证到产业桥接</tspan></text><text x="810.0" y="82" text-anchor="middle" font-size="15" font-weight="400" fill="#667085"><tspan x="810.0" dy="0">图中“直接像素”均指扩散/流过程作用于 raw pixels；DWD 是保留 latent 采样轨迹、仅最终像素读出的混合路线</tspan></text><path d="M285,188.0 C330.0,188.0 330.0,188.0 375,188.0" fill="none" stroke="#596a86" stroke-width="2.5" marker-end="url(#arrow)"/><text x="330.0" y="180.0" text-anchor="middle" font-size="12" font-weight="650" fill="#526174"><tspan x="330.0" dy="0">解决高分辨率</tspan></text><path d="M605,188.0 C650.0,188.0 650.0,188.0 695,188.0" fill="none" stroke="#596a86" stroke-width="2.5" marker-end="url(#arrow)"/><text x="650.0" y="180.0" text-anchor="middle" font-size="12" font-weight="650" fill="#526174"><tspan x="650.0" dy="0">转向 DiT 扩展</tspan></text><path d="M925,188.0 C970.0,188.0 970.0,188.0 1015,188.0" fill="none" stroke="#596a86" stroke-width="2.5" marker-end="url(#arrow)"/><text x="970.0" y="180.0" text-anchor="middle" font-size="12" font-weight="650" fill="#526174"><tspan x="970.0" dy="0">优化学习问题</tspan></text><path d="M1245,188.0 C1290.0,188.0 1290.0,188.0 1335,188.0" fill="none" stroke="#596a86" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1290.0" y="180.0" text-anchor="middle" font-size="12" font-weight="650" fill="#526174"><tspan x="1290.0" dy="0">扩到时空数据</tspan></text><path d="M925,188.0 C1130.0,188.0 1130.0,369.0 1335,369.0" fill="none" stroke="#596a86" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1130.0" y="270.5" text-anchor="middle" font-size="12" font-weight="650" fill="#526174"><tspan x="1130.0" dy="0">统一视觉 token</tspan></text><path d="M605,550.0 C810.0,550.0 810.0,550.0 1015,550.0" fill="none" stroke="#596a86" stroke-width="2.5" marker-end="url(#arrow)"/><text x="810.0" y="542.0" text-anchor="middle" font-size="12" font-weight="650" fill="#526174"><tspan x="810.0" dy="0">复用权重</tspan></text><path d="M1245,550.0 C1290.0,550.0 1290.0,550.0 1335,550.0" fill="none" stroke="#596a86" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1290.0" y="542.0" text-anchor="middle" font-size="12" font-weight="650" fill="#526174"><tspan x="1290.0" dy="0">更低迁移风险</tspan></text><rect x="55" y="125" width="230" height="126" rx="17" fill="#eef1f5" stroke="#526174" stroke-width="2"/><text x="170.0" y="167" text-anchor="middle" font-size="18" font-weight="760" fill="#526174"><tspan x="170.0" dy="0">2020–2022 原生像素扩散</tspan></text><text x="170.0" y="203" text-anchor="middle" font-size="13" font-weight="430" fill="#526174"><tspan x="170.0" dy="0">DDPM / ADM；Imagen 以像素级联扩到 1024²</tspan></text><rect x="375" y="125" width="230" height="126" rx="17" fill="#e8efff" stroke="#3156c8" stroke-width="2"/><text x="490.0" y="167" text-anchor="middle" font-size="18" font-weight="760" fill="#3156c8"><tspan x="490.0" dy="0">2023–2024 高分辨率单阶段</tspan></text><text x="490.0" y="203" text-anchor="middle" font-size="13" font-weight="430" fill="#526174"><tspan x="490.0" dy="0">Simple Diffusion / HDiT /</tspan><tspan x="490.0" dy="17">SiD2：调度、多尺度与 hourglass</tspan></text><rect x="695" y="125" width="230" height="126" rx="17" fill="#f0eaff" stroke="#7449d8" stroke-width="2"/><text x="810.0" y="167" text-anchor="middle" font-size="18" font-weight="760" fill="#7449d8"><tspan x="810.0" dy="0">2025–2026 像素建模架构</tspan></text><text x="810.0" y="203" text-anchor="middle" font-size="13" font-weight="430" fill="#526174"><tspan x="810.0" dy="0">JiT / PixelDiT / PixNerd：大</tspan><tspan x="810.0" dy="17">patch、双层 token、神经场读出</tspan></text><rect x="1015" y="125" width="230" height="126" rx="17" fill="#e4f7ef" stroke="#087f5b" stroke-width="2"/><text x="1130.0" y="167" text-anchor="middle" font-size="18" font-weight="760" fill="#087f5b"><tspan x="1130.0" dy="0">2026 目标与损失</tspan></text><text x="1130.0" y="203" text-anchor="middle" font-size="13" font-weight="430" fill="#526174"><tspan x="1130.0" dy="0">PixelGen / AsymFlow /</tspan><tspan x="1130.0" dy="17">AnisoFlow：感知监督与可学习预测目标</tspan></text><rect x="1335" y="125" width="230" height="126" rx="17" fill="#fff1df" stroke="#b45309" stroke-width="2"/><text x="1450.0" y="167" text-anchor="middle" font-size="18" font-weight="760" fill="#b45309"><tspan x="1450.0" dy="0">2026 进入视频</tspan></text><text x="1450.0" y="203" text-anchor="middle" font-size="13" font-weight="430" fill="#526174"><tspan x="1450.0" dy="0">U-JiT / JVT：像素域视频与 RGB-几何联合生成</tspan></text><rect x="1335" y="306" width="230" height="126" rx="17" fill="#fff1df" stroke="#b45309" stroke-width="2"/><text x="1450.0" y="348" text-anchor="middle" font-size="18" font-weight="760" fill="#b45309"><tspan x="1450.0" dy="0">2026 统一与稀疏扩展</tspan></text><text x="1450.0" y="384" text-anchor="middle" font-size="13" font-weight="430" fill="#526174"><tspan x="1450.0" dy="0">PixelUMM / PixelMoE：统一理解-生成接口与 MoE</tspan><tspan x="1450.0" dy="17">容量扩展</tspan></text><rect x="375" y="487" width="230" height="126" rx="17" fill="#eef1f5" stroke="#526174" stroke-width="2"/><text x="490.0" y="529" text-anchor="middle" font-size="18" font-weight="760" fill="#526174"><tspan x="490.0" dy="0">当前生产默认：latent/VAE</tspan></text><text x="490.0" y="565" text-anchor="middle" font-size="13" font-weight="430" fill="#526174"><tspan x="490.0" dy="0">FLUX.2、Wan、Sora 等公开架构仍以压缩 latent</tspan><tspan x="490.0" dy="17">为主</tspan></text><rect x="1015" y="487" width="230" height="126" rx="17" fill="#e8efff" stroke="#3156c8" stroke-width="2"/><text x="1130.0" y="529" text-anchor="middle" font-size="18" font-weight="760" fill="#3156c8"><tspan x="1130.0" dy="0">迁移路线</tspan></text><text x="1130.0" y="565" text-anchor="middle" font-size="13" font-weight="430" fill="#526174"><tspan x="1130.0" dy="0">AsymFlow / Iris：把 pretrained</tspan><tspan x="1130.0" dy="17">latent 模型转换到 pixel space</tspan></text><rect x="1335" y="487" width="230" height="126" rx="17" fill="#ffe7e7" stroke="#b73535" stroke-width="2"/><text x="1450.0" y="529" text-anchor="middle" font-size="18" font-weight="760" fill="#b73535"><tspan x="1450.0" dy="0">DWD：短期桥接路线</tspan></text><text x="1450.0" y="565" text-anchor="middle" font-size="13" font-weight="430" fill="#526174"><tspan x="1450.0" dy="0">保留 latent 去噪轨迹；最终一步独立 pixel</tspan><tspan x="1450.0" dy="17">head；移除 VAE decoder</tspan></text><text x="1596" y="655" text-anchor="end" font-size="11" fill="#7a8799">综合 arXiv: 2006.11239, 2301.11093, 2401.11605, 2410.19324, 2511.13720, 2511.20645, 2605.12964, 2609.38597, 2611.04764, 2611.18549, 2611.22287（分析性重绘）</text></svg>